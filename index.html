<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pixora — Find your next big idea</title>
    <meta
      name="description"
      content="Pixora is a modern visual discovery platform for photographers, designers and the endlessly curious. Search, save and share the imagery that moves you."
    />

    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Pixora" />
    <meta name="application-name" content="Pixora" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pixora" />
    <meta property="og:title" content="Pixora — Find your next big idea" />
    <meta
      property="og:description"
      content="A fast, private home for visual research. Search photography, design, architecture and film, then build boards you can actually make from."
    />
    <meta property="og:url" content="https://pixora.example.com/" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pixora — visual discovery" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pixora — Find your next big idea" />
    <meta
      name="twitter:description"
      content="A fast, private home for visual research. Search, save and share creative inspiration."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="canonical" href="https://pixora.example.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://picsum.photos" />

    <style>
      html {
        background: #fbfaf7;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0b0c0a;
        }
      }
      #root:empty::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle at 50% 40%, #e9e7dc, transparent 60%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem 1.5rem; font-family: system-ui, sans-serif; text-align: center">
        <h1 style="font-size: 1.5rem">Pixora needs JavaScript enabled</h1>
        <p style="color: #6c7263">
          Turn on JavaScript in your browser to explore visual inspiration with Pixora.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
